name: Java CI with Maven (Smoke Test)

on:
  push:
    branches: [ "master", "main" ] # 当有代码推送到主分支时触发

jobs:
  build-and-test:
    runs-on: ubuntu-latest # 在云端的 Linux 环境下运行

    steps:
      - uses: actions/checkout@v3 # 拉取你的代码

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests (Smoke Test)
        run: mvn test # 执行你配置好的测试任务

      - name: Build JAR File
        run: mvn package -DskipTests # 导出完整 jar 包